<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Pixel Hockey</title>
    <meta name="description" content="Retro pixel-art ice hockey with all 32 NHL teams. Seasons, playoffs and shootouts." />
    <meta name="theme-color" content="#141830" />
    <!-- Home-screen app (iPhone / iPad) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pixel Hockey" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden; background: #141830;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
      }
      canvas#game {
        position: fixed; left: 0; top: 0; display: block; touch-action: none;
        image-rendering: pixelated; image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
